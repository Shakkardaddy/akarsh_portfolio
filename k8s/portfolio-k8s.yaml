apiVersion: v1
kind: Namespace
metadata:
  name: portfolio-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-config
  namespace: portfolio-system
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /auth/ {
            proxy_pass http://auth-service:5000/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            proxy_pass http://auth-service:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: portfolio-system
type: Opaque
stringData:
  PORT: "5000"
  SESSION_SECRET: "akarsh_super_secret_session_key_2026"
  GITHUB_CLIENT_ID: "Ov23li8uTSOWS017UHj7"
  GITHUB_CLIENT_SECRET: "2293ff76112d71420d838f16972b9d2348cee6bc"
  GITHUB_CALLBACK_URL: "https://xixi.co.in/auth/github/callback"
  FRONTEND_URL: "https://xixi.co.in"
  RAZORPAY_KEY_ID: "rzp_test_TvJhZhCS5tTmDa"
  RAZORPAY_KEY_SECRET: "xay5g1CRHCUO3Y6XdUiS53bM"
---
# 1. Auth Service Deployment (Node.js + MFA API)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: portfolio-system
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: shakkardaddy1/portfolio-auth:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: auth-secret
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: portfolio-system
spec:
  selector:
    app: auth-service
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
---
# 2. Frontend & Reverse Proxy Deployment (Nginx)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: portfolio-system
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: shakkardaddy1/portfolio-frontend:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: portfolio-system
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  type: NodePort
---
# 3. Kubernetes Ingress (Routing xixi.co.in to frontend)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: portfolio-system
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: xixi.co.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  - host: www.xixi.co.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
