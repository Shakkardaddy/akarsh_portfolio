services:
  # ---------------- SECONDARY WEBSERVER (DIFF IP) ----------------
  portfolio-web:
    image: shakkardaddy1/portfolio:v2
    container_name: portfolio-web
    ports:
      - "8080:80"
    restart: always

  # ---------------- PRESTASHOP E-COMMERCE CONTAINER ----------------
  prestashop-db:
    image: mysql:5.7
    container_name: prestashop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: prestashop_root_pass
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: prestashop_pass
    volumes:
      - prestashop_db_data:/var/lib/mysql
    networks:
      - stack-net
    restart: always

  prestashop-app:
    image: prestashop/prestashop:latest
    container_name: prestashop-container
    ports:
      - "8085:80"
    environment:
      DB_SERVER: prestashop-db
      DB_USER: prestashop
      DB_PASSWD: prestashop_pass
      DB_NAME: prestashop
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: "16.4.43.176:8085"
      ADMIN_MAIL: "admin@akarsh.com"
      ADMIN_PASSWD: "AkarshDevOps2026!"
    depends_on:
      - prestashop-db
    networks:
      - stack-net
    restart: always

  # ---------------- PROMETHEUS + GRAFANA ----------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - stack-net
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - stack-net
    restart: always

  # ---------------- ELK STACK (ELASTICSEARCH + KIBANA) ----------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - stack-net
    restart: always

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - stack-net
    restart: always

networks:
  stack-net:
    driver: bridge

volumes:
  prestashop_db_data:
  grafana_data:
  es_data:
